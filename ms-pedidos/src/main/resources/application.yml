server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672},localhost:5673}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  seed:
    enabled: ${SEED_ENABLED:false}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    interval-ms: 2000
  messaging:
    direct-exchange: wd.pedidos.direct
    topic-exchange: wd.eventos.topic
    created-key: pedido.creado
    deleted-key: pedido.eliminado
    state-prefix: pedido.estado.
