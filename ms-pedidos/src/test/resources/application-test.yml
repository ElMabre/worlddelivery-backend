spring:
  datasource:
    url: jdbc:h2:mem:pedidos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.example.test
  rabbitmq:
    username: test
    password: test
    dynamic: false
app:
  seed:
    enabled: true
  outbox:
    enabled: false
  cors:
    allowed-origins: https://frontend.example.test
