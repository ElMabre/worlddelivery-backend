name: worlddelivery-rabbitmq
x-rabbit-common: &rabbit-common
  image: rabbitmq:4.2.9-management
  restart: unless-stopped
  stop_grace_period: 60s
  environment: &rabbit-env
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE}
  networks: [rabbitmq]
  healthcheck:
    # Ping checks the Erlang VM, not application readiness. This avoids a
    # restart deadlock when the first node waits for its existing peer.
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
services:
  rabbitmq-1:
    <<: *rabbit-common
    hostname: rabbitmq-1
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  rabbitmq-2:
    <<: *rabbit-common
    hostname: rabbitmq-2
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
networks:
  rabbitmq:
    driver: bridge
volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
